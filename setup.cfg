[metadata]
name = sdbi-precommit-hooks
version = 1.0.0
description = Pediatrix SDBI pre-commit hooks
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/pre-commit/pre-commit-hooks
author = Pediatrix SDBI
author_email = devsecops@pediatrix.com
license = MIT
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: Implementation :: CPython
    Programming Language :: Python :: Implementation :: PyPy

[options]
packages = find:
python_requires = >=3.10

[options.packages.find]
exclude =
    tests*
    testing*
include =
    pre_commit_enforcement

[options.entry_points]
console_scripts =
    record-precommit-ran = pre_commit_enforcement.record_precommit_ran:main
